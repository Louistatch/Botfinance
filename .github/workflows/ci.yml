name: CI

on:
  push:
    branches: [main]
  pull_request:

# Annule les exécutions redondantes sur une même réf.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build & tests
    runs-on: ubuntu-latest
    env:
      # Prisma lit DATABASE_URL depuis le schéma ; une valeur factice suffit
      # pour `prisma generate` (aucune connexion n'est établie).
      DATABASE_URL: postgresql://user:pass@localhost:5432/db?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances (workspaces)
        run: npm ci

      - name: Générer le client Prisma
        run: npm run prisma:generate --workspace backend

      - name: Compiler le backend
        run: npm run build --workspace backend

      - name: Tests unitaires
        run: npm test --workspace backend

      - name: Tests e2e (API)
        run: npm run test:e2e --workspace backend

  dashboard:
    name: Dashboard — build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances (workspaces)
        run: npm ci

      - name: Build Next.js
        run: npm run build --workspace dashboard
